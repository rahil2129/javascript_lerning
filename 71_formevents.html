<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Event</title>
</head>
<body>
    <form action="" onsubmit="submitFunction()">
        <label for="name">Name</label><input type="email" id="test"  onfocus="focusFunction(this)" onblur="blurFunction(this)" onchange="changeFunction(this)" onselect="selectFunction()" oninvalid="invalidFunction()" required><br><br>
        <label for="class">Class</label><input type="text" onfocus="focusFunction(this)" onblur="blurFunction(this)" oninput="inputFunction(this)" onchange="changeFunction(this)"><br><br>
        <label for="country">Country</label>
        <select name="" id="" onfocus="focusFunction(this)" onblur="blurFunction(this)" oninput="inputFunction(this)" onchange="changeFunction(this)">
            <option value="India">India</option>
            <option value="America">America</option>
            <option value="Pakistan">Pakistan</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="Sri lanka">Sri lanka</option>
        </select>
        <div id="writing" style="border: 2px solid red;"></div>
        <input type="submit">
    </form>
    <script src="js/form-events.js"></script>
</body>
</html>
