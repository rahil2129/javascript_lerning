<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open and Close window</title>
</head>
<body>
    <button onclick="openWindow()">Open Window</button>
    <button onclick="closeWindow()">Close Window</button>
    <script>
        var wName;
        function openWindow() {
            wName = window.open("https://github.com/rahil2129/javascript_lerning", "", "width=600px,height=500px,left=600px,top=300px");
        }

        function closeWindow() {
            alert('Are you sure');
            if(wName){
                wName.close();
            }
        }
    </script>
</body>
</html>
