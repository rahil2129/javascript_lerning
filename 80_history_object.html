<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Object</title>
</head>
<body>
    <h1>Hello This is history object Example</h1>
    <button onclick="previousFunction()">Previous</button>
    <button onclick="nextFunction()">Next</button>
    <button onclick="goFunction()">Go</button>
    <script>
        function previousFunction() {
            history.back();
        }

        function nextFunction() {
            history.forward();
        }

        function goFunction() {
            history.go(-1);
        }
    </script>
</body>
</html>
